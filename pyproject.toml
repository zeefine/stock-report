[project]
name = "stock-report"
version = "0.1.0"
description = "Deterministic close-report pipeline for US, China and Hong Kong equities"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "akshare>=1.14.0",
    "baostock>=0.9.1",
    "ddgs>=9.0.0",
    "mplfinance>=0.12.10b0",
    "pandas>=2.0.0",
    "playwright>=1.42.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "yfinance>=0.2.40",
]

[project.scripts]
stock-report = "stock_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_report"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
