[project]
name = "stock-report"
version = "0.1.0"
description = "Deterministic close-report pipeline for US, China and Hong Kong equities"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
stock-report = "stock_report.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_report"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
