<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>市场新闻扫描</title>
  <style>
    :root{--bg:#f5f7fa;--panel:#fff;--ink:#152033;--muted:#6b7688;--line:#dfe4eb;--accent:#1463ff;--good:#16835b;--bad:#c53b3b;--warn:#a66b00}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    a{color:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:32px auto 64px}
    header,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
    header{padding:28px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:30px;line-height:1.2;margin:6px 0 8px}.sub{color:var(--muted);margin:0}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:22px}
    .stat{padding:14px;background:#f8fafc;border:1px solid var(--line);border-radius:9px}
    .stat b{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:1fr 1.55fr;gap:16px;margin-top:16px}.panel{padding:20px;margin-top:16px}
    .grid .panel{margin:0}h2{font-size:17px;margin:0 0 14px}.note{color:var(--muted);font-size:12px}
    .bar-row{display:grid;grid-template-columns:88px 1fr 34px;align-items:center;gap:9px;margin:10px 0}
    .bar-track{height:7px;background:#edf0f5;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:9px}
    .event{padding:13px 0;border-top:1px solid var(--line)}.event:first-child{border-top:0;padding-top:0}
    .event-head{display:flex;align-items:flex-start;gap:10px}.score{flex:0 0 34px;text-align:center;padding:4px 0;border-radius:6px;background:#eaf1ff;color:#0c55dc;font-weight:700}
    .event a{font-weight:650;text-decoration:none}.event a:hover{text-decoration:underline}.meta{color:var(--muted);font-size:12px;margin-top:3px}
    .controls{display:flex;gap:10px;margin-bottom:12px}.controls input,.controls select{border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:#fff;color:var(--ink)}
    .controls input{flex:1;min-width:120px}.scroll{overflow:auto;border:1px solid var(--line);border-radius:8px}
    table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{position:sticky;top:0;background:#f8fafc;color:var(--muted);font-size:12px;font-weight:600}tr:last-child td{border-bottom:0}
    td a{text-decoration:none;font-weight:600}td a:hover{text-decoration:underline}.tag{display:inline-block;margin:1px 4px 1px 0;padding:2px 6px;border-radius:5px;background:#eef2f7;color:#536071;font-size:11px}
    .ok{color:var(--good)}.error{color:var(--bad)}.empty{color:var(--warn)}.blank{padding:24px;text-align:center;color:var(--muted)}
    footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:800px){.wrap{width:min(100% - 20px,1180px);margin-top:10px}header{padding:20px}h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.controls{flex-wrap:wrap}.controls input{flex-basis:100%}}
    @media print{body{background:#fff}.wrap{width:100%;margin:0}.controls{display:none}header,.panel{break-inside:avoid}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">Market news monitor</div>
      <h1 id="title">市场新闻扫描</h1>
      <p class="sub" id="window"></p>
      <div class="stats" id="stats"></div>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>主题分布</h2>
        <div id="topics"></div>
      </section>
      <section class="panel">
        <h2>优先事件 <span class="note">按关注度排序，仅为候选事件</span></h2>
        <div id="events"></div>
      </section>
    </div>

    <section class="panel">
      <h2>新闻明细 <span class="note" id="news-count"></span></h2>
      <div class="controls">
        <input id="query" type="search" placeholder="搜索标题、摘要或来源" aria-label="搜索新闻">
        <select id="topic-filter" aria-label="筛选主题"><option value="">全部主题</option></select>
        <select id="source-filter" aria-label="筛选来源"><option value="">全部来源</option></select>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>时间（UTC）</th><th>主题</th><th>来源</th><th>标题与摘要</th></tr></thead>
          <tbody id="news-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>来源状态</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>状态</th><th>来源</th><th>取得条数</th><th>抓取时间</th><th>错误</th></tr></thead>
          <tbody id="source-body"></tbody>
        </table>
      </div>
    </section>
    <footer id="footer"></footer>
  </main>

  <script id="market-news-data" type="application/json">__MARKET_NEWS_DATA__</script>
  <script>
    const data=JSON.parse(document.getElementById("market-news-data").textContent);
    const manifest=data.manifest||{}, raw=data.raw||[], eventPack=data.events||{}, sourcePack=data.sources||{};
    const events=eventPack.events||[], sources=sourcePack.sources||[], stats=manifest.stats||{};
    const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node};
    const time=v=>v?(v.replace("T"," ").replace("Z"," UTC")):"未提供";
    const addStat=(value,label)=>{const box=el("div",undefined,"stat");box.append(el("b",String(value??0)),el("span",label));document.getElementById("stats").append(box)};
    document.getElementById("title").textContent=`${manifest.market||eventPack.market||"ALL"} 市场新闻扫描`;
    document.getElementById("window").textContent=`窗口：${time(manifest.window?.start)} — ${time(manifest.window?.end)} · 生成：${time(manifest.generated_at)}`;
    addStat(stats.deduplicated_items??raw.length,"新闻条数");addStat(stats.events??events.length,"候选事件");
    addStat(stats.selected_sources??sources.length,"来源总数");addStat(stats.successful_sources??0,"成功来源");addStat(stats.failed_sources??0,"失败来源");

    const topicCounts=raw.reduce((m,x)=>(m[x.topic||"other"]=(m[x.topic||"other"]||0)+1,m),{});
    const topicRows=Object.entries(topicCounts).sort((a,b)=>b[1]-a[1]), maxTopic=Math.max(1,...topicRows.map(x=>x[1]));
    const topicsBox=document.getElementById("topics");
    if(!topicRows.length)topicsBox.append(el("div","没有新闻数据","blank"));
    topicRows.forEach(([name,count])=>{const row=el("div",undefined,"bar-row"),track=el("div",undefined,"bar-track"),bar=el("div",undefined,"bar");bar.style.width=`${count/maxTopic*100}%`;track.append(bar);row.append(el("span",name),track,el("b",String(count)));topicsBox.append(row)});

    const eventBox=document.getElementById("events");
    if(!events.length)eventBox.append(el("div","没有候选事件","blank"));
    events.slice(0,12).forEach(event=>{const row=el("div",undefined,"event"),head=el("div",undefined,"event-head"),body=el("div"),title=el("span",event.headline||"未命名事件");body.append(title,el("div",`${event.topic||"other"} · ${event.corroboration_count||0}个来源 · ${time(event.last_updated_at)}`,"meta"));head.append(el("span",String(event.attention_score??0),"score"),body);row.append(head);eventBox.append(row)});

    const query=document.getElementById("query"),topicFilter=document.getElementById("topic-filter"),sourceFilter=document.getElementById("source-filter");
    const addOption=(select,value)=>{const option=el("option",value);option.value=value;select.append(option)};
    [...new Set(raw.map(x=>x.topic).filter(Boolean))].sort().forEach(v=>addOption(topicFilter,v));
    [...new Set(raw.map(x=>x.source_name).filter(Boolean))].sort().forEach(v=>addOption(sourceFilter,v));
    function renderNews(){
      const q=query.value.trim().toLowerCase(),topic=topicFilter.value,source=sourceFilter.value;
      const filtered=raw.filter(x=>(!topic||x.topic===topic)&&(!source||x.source_name===source)&&(!q||`${x.title} ${x.summary} ${x.source_name}`.toLowerCase().includes(q)));
      document.getElementById("news-count").textContent=`显示 ${Math.min(filtered.length,300)} / ${filtered.length} 条`;
      const body=document.getElementById("news-body");body.replaceChildren();
      if(!filtered.length){const td=el("td","没有匹配结果","blank");td.colSpan=4;const tr=el("tr");tr.append(td);body.append(tr);return}
      filtered.slice(0,300).forEach(x=>{const tr=el("tr"),link=el("a",x.title||"未命名");if(x.url){link.href=x.url;link.target="_blank";link.rel="noopener noreferrer"}const detail=el("div");detail.append(link);if(x.summary)detail.append(el("div",x.summary,"meta"));(x.filter_labels||[]).forEach(t=>detail.append(el("span",t,"tag")));tr.append(el("td",time(x.published_at)),el("td",x.topic||"other"),el("td",x.source_name||x.source_id),detail);body.append(tr)});
    }
    [query,topicFilter,sourceFilter].forEach(node=>node.addEventListener("input",renderNews));renderNews();

    const sourceBody=document.getElementById("source-body");
    sources.slice().sort((a,b)=>(a.status||"").localeCompare(b.status||"")||(a.name||"").localeCompare(b.name||"")).forEach(x=>{const tr=el("tr"),status=el("b",x.status||"unknown",x.status||"");tr.append(el("td"),el("td",x.name||x.source_id),el("td",String(x.items_received??0)),el("td",time(x.fetched_at)),el("td",x.error||""));tr.firstChild.append(status);sourceBody.append(tr)});
    document.getElementById("footer").textContent=`Schema ${manifest.schema_version||"—"} · 数据源配置 ${manifest.config_sha256?.slice(0,12)||"—"} · 页面为原始扫描结果的可视化，不构成投资建议`;
  </script>
</body>
</html>
